apiVersion: v1
kind: Pod
metadata:
  name: auth-mysql-recovery
  namespace: civicpulse
spec:
  restartPolicy: Never
  containers:
    - name: mysql
      image: mysql:8.0
      command: ["mysqld"]
      args: ["--skip-grant-tables", "--skip-networking"]
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumes:
    - name: mysql-data
      persistentVolumeClaim:
        claimName: auth-mysql-migration-pvc
---
