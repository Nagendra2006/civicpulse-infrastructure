apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: civicpulse
spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway-service

  template:
    metadata:
      labels:
        app: gateway-service

    spec:
      containers:
        - name: gateway-service

          image: illuriganesh123/civicpulse-gateway-service:3
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8089

          env:

            - name: FRONTEND_CORS_URL_1
              value: "http://localhost:3000"
            
            - name: FRONTEND_CORS_URL_2
              value: "http://localhost:5173"

            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"

            - name: GRIEVANCE_SERVICE_URL
              value: "http://grievance-service:8082"

            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8083"