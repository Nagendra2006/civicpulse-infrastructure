apiVersion: apps/v1
kind: Deployment
metadata:
  name: grievance-mysql
  namespace: civicpulse
spec:
  replicas: 1

  selector:
    matchLabels:
      app: grievance-mysql

  template:
    metadata:
      labels:
        app: grievance-mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grievance-service-secret
                  key: SPRING_DATASOURCE_PASSWORD

            - name: MYSQL_DATABASE
              value: civicpulse_grievance_db

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"

            limits:
              memory: "1Gi"
              cpu: "500m"