apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-mysql
  namespace: civicpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-mysql

  template:
    metadata:
      labels:
        app: auth-mysql

    spec:
      containers:
        - name: auth-mysql
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: SPRING_DATASOURCE_PASSWORD

            - name: MYSQL_DATABASE
              value: civicpulse_auth_db